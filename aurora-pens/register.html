<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Aurora Pens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #faf9f6; }
        h2 { font-family: 'Playfair Display', serif; }
        .btn-accent { background-color: #d4af37; color: #fff; border-radius: 0; font-weight: 500; }
        .btn-accent:hover { background-color: #b5952f; color: #fff; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px; border: none;">
        <h2 class="text-center mb-4">Create Account</h2>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-accent w-100">Register</button>
        </form>
        <div id="message" class="mt-3 text-center"></div>
        <div class="mt-3 text-center small">
            <a href="login.html" class="text-decoration-none text-muted">Already have an account? Login</a><br><br>
            <a href="index.php" class="text-decoration-none text-muted">Back to Catalog</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('api/register.php', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                const msgDiv = document.getElementById('message');
                if (result.status === 'success') {
                    msgDiv.innerHTML = `<span class="text-success">${result.message}</span>`;
                    document.getElementById('registerForm').reset();
                } else {
                    msgDiv.innerHTML = `<span class="text-danger">${result.message}</span>`;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
